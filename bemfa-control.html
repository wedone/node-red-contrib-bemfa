<script type="text/javascript">
    RED.nodes.registerType('bemfa-control', {
        category: '巴法云',
        color: '#FF9800',
        defaults: {
            name: { value: "" },
            bemfa: { type: "bemfa-config", required: true },
            topic: { value: "" },
            command: { value: "" },
            useMsgPayload: { value: true },
            useHttpApi: { value: false },
            deviceType: { value: "3" }
        },
        inputs: 1,
        outputs: 1,
        icon: "bridge.svg",
        label: function() {
            return this.name || "巴法控制";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>

<script type="text/html" data-template-name="bemfa-control">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
        <input type="text" id="node-input-name" placeholder="名称">
    </div>
    <div class="form-row">
        <label for="node-input-bemfa"><i class="fa fa-globe"></i> 配置</label>
        <input type="text" id="node-input-bemfa">
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-envelope"></i> 主题</label>
        <input type="text" id="node-input-topic" placeholder="例如: led002">
    </div>
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-terminal"></i> 固定命令</label>
        <input type="text" id="node-input-command" placeholder="例如: on 或 off">
    </div>
    <div class="form-row">
        <label style="width: auto;">
            <input type="checkbox" id="node-input-useMsgPayload" style="display: inline-block; width: auto; vertical-align: top;">
            使用输入消息的 payload 作为命令
        </label>
    </div>
    <hr>
    <div class="form-row">
        <label style="width: auto;">
            <input type="checkbox" id="node-input-useHttpApi" style="display: inline-block; width: auto; vertical-align: top;">
            使用 HTTP API 发送（不依赖 MQTT 连接）
        </label>
    </div>
    <div class="form-row">
        <label for="node-input-deviceType"><i class="fa fa-microchip"></i> 设备类型</label>
        <select id="node-input-deviceType">
            <option value="1">MQTT 协议 (1)</option>
            <option value="3" selected>TCP 协议 (3)</option>
            <option value="5">MQTT V2 (5)</option>
            <option value="7">TCP V2 (7)</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="bemfa-control">
    <p>向巴法云设备发送控制命令</p>
    
    <h3>输入</h3>
    <dl class="message-properties">
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>设备主题（覆盖节点配置）</dd>
        <dt class="optional">payload <span class="property-type">string/object</span></dt>
        <dd>要发送的命令内容</dd>
        <dt class="optional">useHttpApi <span class="property-type">boolean</span></dt>
        <dd>临时使用 HTTP API（覆盖节点配置）</dd>
    </dl>
    
    <h3>输出</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>发送到的主题</dd>
        <dt>payload <span class="property-type">string</span></dt>
        <dd>发送的内容</dd>
        <dt>success <span class="property-type">boolean</span></dt>
        <dd>是否发送成功</dd>
        <dt>result <span class="property-type">object</span></dt>
        <dd>HTTP API 返回的结果（仅 HTTP 模式）</dd>
    </dl>
    
    <h3>使用方式</h3>
    <p><b>方式 1：MQTT 发布（默认）</b></p>
    <p>通过 MQTT 连接发送命令，需要保持 MQTT 连接</p>
    
    <p><b>方式 2：HTTP API</b></p>
    <p>勾选"使用 HTTP API"，通过 HTTP 接口发送，不依赖 MQTT 连接</p>
    
    <h3>设备类型</h3>
    <ul>
        <li><b>1</b> - MQTT 协议设备</li>
        <li><b>3</b> - TCP 协议设备</li>
        <li><b>5</b> - MQTT V2（内测）</li>
        <li><b>7</b> - TCP V2（内测）</li>
    </ul>
    
    <h3>示例</h3>
    <p>MQTT 模式输入: <code>{"payload": "on"}</code></p>
    <p>HTTP 模式输入: <code>{"payload": "on", "useHttpApi": true}</code></p>
</script>
